<ion-app>
  <ion-menu contentId="main-content" type="overlay">
    <ion-content>
      <ion-list lines="none">
        <ion-list-header>{{ 'menu.title' | translate }}</ion-list-header>

        @for (section of sections; track section.path) {
          <ion-menu-toggle autoHide="false">
            <ion-item
              [routerLink]="section.path"
              routerLinkActive="selected"
              [routerLinkActiveOptions]="{ exact: false }"
              button
              detail="false">
              <ion-icon slot="start" [name]="section.icon" />
              <ion-label>{{ section.label | translate }}</ion-label>
            </ion-item>
          </ion-menu-toggle>
        }
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content" />
</ion-app>
