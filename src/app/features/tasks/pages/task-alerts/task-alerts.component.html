<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button class="round-button" defaultHref="/tasks" text="" />
    </ion-buttons>
    <ion-title>Avisos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <section class="section">
    <h2 class="section__title">Vencidas</h2>

    @for (task of overdue(); track task.id) {
      <app-task-card class="stacked" [task]="task" variant="soft" [showDate]="true"
                     (toggled)="toggle($event)" />
    } @empty {
      <p class="empty">Nada vencido. Vas al día 👌</p>
    }
  </section>

  <section class="section">
    <h2 class="section__title">Próximas</h2>

    @for (task of upcoming(); track task.id) {
      <app-task-card class="stacked" [task]="task" variant="soft" [showDate]="true"
                     (toggled)="toggle($event)" />
    } @empty {
      <p class="empty">No tenés tareas pendientes agendadas.</p>
    }
  </section>
</ion-content>
